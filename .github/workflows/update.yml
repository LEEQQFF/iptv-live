name: 更新直播源与EPG

on:
  schedule:
    # 每小时自动更新一次（央视频官方流带时效 vkey，需高频刷新）
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 与 refresh.yml 共用并发组，两者串行执行，避免同时推送/Pages 冲突
concurrency:
  group: iptv-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 不再使用 github-pages environment；Pages 由 refresh.yml 统一部署
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取聚合生成清单与EPG
        run: python scripts/main.py --config config/sources.yaml --out output

      - name: 提交更新结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/live.m3u output/live.txt output/e.xml output/status.json
          if git diff --cached --quiet; then
            echo "本次无变化"
          else
            git pull --rebase origin main || true
            git commit -m "自动更新直播源 $(date -u +%Y-%m-%dT%H:%MZ)" || true
            git push || true
          fi

      # Pages 部署统一由 refresh.yml 负责（每 10 分钟），此处不再争抢 environment

