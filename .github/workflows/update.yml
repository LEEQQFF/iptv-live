name: 更新直播源与EPG

on:
  schedule:
    # 每 4 小时自动更新一次（UTC），即北京时间 0/4/8/12/16/20 点
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取聚合生成清单与EPG
        run: python scripts/main.py --config config/sources.yaml --out output

      - name: 提交更新结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "本次无变化"
          else
            git commit -m "自动更新直播源 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
