# ============================================================
# IPTV 直播源聚合配置
# 每个 source 的 urls 按顺序尝试，任一成功即停（镜像回退）。
# GitHub Actions 运行环境可直连 raw.githubusercontent.com；
# 本地/国内环境优先走自有域名镜像。
# ============================================================

settings:
  # 每个频道最多保留的接口数（官方直采置顶 + 多源交叉验证排序）
  max_urls_per_channel: 3
  # 台标模板（{id} 替换为 tvg-id）
  logo_template: "https://tb.zbds.top/logo/{id}.png"
  # 是否保留无法归入 央视/卫视/地方 的频道（如港澳台、海外中文台）
  include_other: false
  # 频道名黑名单关键词（命中即剔除）
  exclude_keywords: ["购物", "广告", "测试", "导视", "博彩", "占位", "支持作者"]
  # 已在国内完成测速验效的上游项目：其央视/卫视接口即使境外测活失败也保留为备用线路
  prevalidated_sources: ["guovin-iptv-api"]
  # 官方/电视台自营 CDN 域名（命中则排序优先）
  official_domains:
    - cctv.com
    - cntv.cn
    - yangshipin.cn
    - cztv.com
    - jlntv.cn
    - juyun.tv
    - brtvcloud.com
    - wasu.cn
    - miguvideo.com
    - cmvideo.cn
    - hoolo.tv
    - tvhuan.com
    - kankanlive.com
    - jstv.com
    - zrtg.com
    - sdtv.com.cn
    - hnntv.cn
    - hbtv.com.cn
    - gdtv.cn
    - scgc.tv
    - cqtv.cn
    - xjtvs.com.cn
    - nmtv.cn
    - lntv.com.cn
    - jilintv.cn
    - hljtv.com
    - ahtv.cn
    - fjtvs.com
    - jxtv.com.cn
    - sxtvs.com
    - gstv.com.cn
    - qhbtv.com
    - nxtv.com.cn
    - xjtvs.com
    - tibet.cn
    - yntv.cn
    - gzstv.com
    - gxntv.com.cn
    - hainantv.com
    - hebtv.com
    - sxrtv.com
    - sjtv.cn
    - snrtv.com
    - cnwest.com
    - ysp.cctv.cn
    - cctvplus.com
    - cgtn.com

  probe:
    enabled: true
    timeout: 8          # 单接口测活超时（秒）
    workers: 32         # 并发数
    max_per_channel: 8  # 每频道最多送测接口数（控制总耗时）
    # 存活率低于该值时，判定运行环境网络受限，跳过过滤只排序
    min_alive_ratio: 0.05

  epg:
    keep_days: 3        # 节目单保留天数（今天起向后）
    urls:
      - "http://epg.51zmt.top:8000/e.xml"
      - "https://live.fanmingming.com/e.xml"
      - "https://raw.githubusercontent.com/fanmingming/live/main/e.xml"
      - "https://ghgo.xyz/raw.githubusercontent.com/fanmingming/live/main/e.xml"

